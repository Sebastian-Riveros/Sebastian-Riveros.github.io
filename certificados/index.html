<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación Oficial de Certificados | Riveros & Co.</title>
  <style>
    :root {
      --plum-dark: #15011E;
      --plum-main: #2D053E;
      --plum-light: #4A1061;
      --mint-vibrant: #00D09C;
      --mint-dark: #009E76;
      --text-light: #F4EFF8;
      --text-muted: #A99BB8;
      --card-bg: #23042E;
      --border-soft: rgba(0, 208, 156, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #12011A 0%, #250433 40%, #15011E 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 25px 15px;
    }

    .brand-header {
      background: var(--plum-dark);
      border: 1px solid var(--border-soft);
      border-radius: 9999px;
      padding: 6px 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 208, 156, 0.15);
      border: 1px solid var(--mint-vibrant);
      color: var(--mint-vibrant);
      font-size: 8pt;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 15px;
    }

    .badge-invalid {
      background: rgba(230, 0, 122, 0.15);
      border-color: #E6007A;
      color: #FF52A3;
    }

    h1 {
      font-size: 15pt;
      font-weight: 800;
      margin-bottom: 4px;
      color: #FFFFFF;
    }

    .subtitle {
      font-size: 8.5pt;
      color: var(--text-muted);
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .data-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 10px 12px;
    }

    .data-item.full-width {
      grid-column: span 2;
    }

    .label {
      font-size: 6.8pt;
      font-weight: 800;
      color: var(--mint-vibrant);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .value {
      font-size: 9.5pt;
      font-weight: 700;
      color: #FFFFFF;
    }

    .value.name {
      font-size: 12pt;
      font-weight: 800;
      color: #00FFBE;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .search-box input {
      flex: 1;
      background: var(--plum-dark);
      border: 1px solid var(--plum-light);
      border-radius: 6px;
      padding: 8px 12px;
      color: #FFF;
      font-size: 9pt;
      outline: none;
    }

    .search-box button {
      background: var(--mint-vibrant);
      color: var(--plum-dark);
      border: none;
      border-radius: 6px;
      font-weight: 800;
      padding: 8px 16px;
      cursor: pointer;
    }

    .footer-note {
      font-size: 7.2pt;
      color: var(--text-muted);
      text-align: center;
      margin-top: 25px;
    }
  </style>
</head>

    function obtenerParametroUrl(nombre) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(nombre);
    }

    function renderizarVista() {
      const folio = (obtenerParametroUrl('id') || '').trim().toUpperCase();
      const card = document.getElementById('certCard');

      if (!folio) {
        // Vista 1: Entrada sin ID (Buscador manual)
        card.innerHTML = `
          <div class="badge-status">Portal de Acreditación Oficial</div>
          <h1>Validación de Certificados Laborales</h1>
          <p class="subtitle">Ingrese el código de folio que figura al reverso o pie de página del certificado físico o digital emitido por Riveros &amp; Co.</p>
          <div class="search-box">
            <input type="text" id="manualFolio" placeholder="Ej: AV-TRONCAL-2026-0001">
            <button onclick="buscarManual()">Verificar</button>
          </div>
        `;
        return;
      }

      const datos = REGISTRO_CERTIFICADOS[folio];

      if (datos) {
        // Vista 2: Folio Válido Encontrado (Solo muestra los datos de este titular)
        card.innerHTML = `
          <div class="badge-status">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            ${datos.estado}
          </div>
          <h1>Certificación de Competencias Laborales</h1>
          <p class="subtitle">Validación oficial emitida en conformidad al protocolo de evaluación y asistencia.</p>

          <div class="data-grid">
            <div class="data-item full-width">
              <div class="label">Titular Acreditado</div>
              <div class="value name">${datos.nombre}</div>
            </div>
            <div class="data-item">
              <div class="label">Cargo / Función</div>
              <div class="value">${datos.cargo}</div>
            </div>
            <div class="data-item">
              <div class="label">Empresa Patrocinante</div>
              <div class="value">${datos.empresa}</div>
            </div>
            <div class="data-item full-width">
              <div class="label">Programa Formativo Acreditado</div>
              <div class="value">${datos.curso}</div>
            </div>
            <div class="data-item">
              <div class="label">Folio Único</div>
              <div class="value" style="font-family: monospace; color: var(--mint-vibrant);">${folio}</div>
            </div>
            <div class="data-item">
              <div class="label">Fecha de Emisión</div>
              <div class="value">${datos.fecha}</div>
            </div>
          </div>
        `;
      } else {

        card.innerHTML = `

    function buscarManual() {
      const input = document.getElementById('manualFolio').value.trim();
      if (input) {
        window.location.search = '?id=' + encodeURIComponent(input);
      }
    }
